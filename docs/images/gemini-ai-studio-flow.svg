<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0c0e14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bgGlow)" rx="16"/>
  <rect width="958" height="478" x="1" y="1" fill="none" stroke="#232936" stroke-width="1.5" rx="15"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="90" y="17" fill="#C084FC" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">AI AGENT ENGINE</text>
    
    <text x="0" y="58" fill="#FFFFFF" font-size="24" font-weight="700" letter-spacing="-0.5">Google Gemini AI Content Studio &amp; Schema Engine</text>
    <text x="0" y="82" fill="#94A3B8" font-size="14">Eliminates AI hallucinations by grounding prompts in real MySQL pedigree data &amp; enforcing strict JSON schema.</text>
  </g>

  <!-- 3 Steps Grid -->
  <!-- Step 1: Real DB Context -->
  <g transform="translate(48, 150)" filter="url(#cardShadow)">
    <rect width="260" height="260" rx="12" fill="#151922" stroke="#2D3748" stroke-width="1.5"/>
    <rect width="260" height="36" rx="12" fill="#1F2633"/>
    <path d="M0,24 L0,36 L260,36 L260,24 Z" fill="#1F2633"/>
    <text x="16" y="23" fill="#60A5FA" font-size="12" font-weight="700">1. GROUNDED CONTEXT</text>

    <text x="16" y="65" fill="#E2E8F0" font-size="12" font-weight="700">Real Database Facts Injection</text>
    <text x="16" y="85" fill="#94A3B8" font-size="11">No generic AI filler. We inject:</text>

    <rect x="16" y="100" width="228" height="70" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="120" fill="#38BDF8" font-size="10" font-family="monospace">• Real Cat Names (Baron, Staś)</text>
    <text x="24" y="136" fill="#38BDF8" font-size="10" font-family="monospace">• Genetic Tests (HCM, PKD)</text>
    <text x="24" y="152" fill="#38BDF8" font-size="10" font-family="monospace">• Registered Cattery Cert #58</text>

    <rect x="16" y="185" width="228" height="50" rx="6" fill="#1E293B"/>
    <text x="24" y="205" fill="#94A3B8" font-size="10">Target Search Intent:</text>
    <text x="24" y="222" fill="#FDE047" font-size="11" font-weight="600">"Koty bengalskie charakter i cena"</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(318, 270)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="22,-4 30,0 22,4" fill="#818CF8"/>
  </g>

  <!-- Step 2: Gemini API with Strict Schema -->
  <g transform="translate(358, 140)" filter="url(#cardShadow)">
    <rect width="260" height="280" rx="14" fill="#161B26" stroke="#8B5CF6" stroke-width="2"/>
    <rect width="260" height="40" rx="12" fill="url(#geminiGrad)"/>
    <path d="M0,26 L0,40 L260,40 L260,26 Z" fill="#7C3AED"/>
    <text x="16" y="25" fill="#FFFFFF" font-size="13" font-weight="800">2. GEMINI 2.0 FLASH API</text>

    <text x="16" y="65" fill="#E2E8F0" font-size="12" font-weight="700">Strict JSON Output Schema</text>
    <text x="16" y="82" fill="#C084FC" font-size="10" font-family="monospace">response_schema: ArticleStructure</text>

    <!-- Schema details -->
    <rect x="16" y="95" width="228" height="120" rx="6" fill="#0A0F1D" stroke="#4C1D95" stroke-width="1"/>
    <text x="24" y="115" fill="#F472B6" font-size="10" font-family="monospace">{</text>
    <text x="32" y="130" fill="#93C5FD" font-size="10" font-family="monospace">"title": "string (55-60c)",</text>
    <text x="32" y="145" fill="#93C5FD" font-size="10" font-family="monospace">"excerpt": "clean string",</text>
    <text x="32" y="160" fill="#93C5FD" font-size="10" font-family="monospace">"sections": [ { "h2", "p" } ],</text>
    <text x="32" y="175" fill="#93C5FD" font-size="10" font-family="monospace">"breeder_tip": "callout",</text>
    <text x="32" y="190" fill="#93C5FD" font-size="10" font-family="monospace">"schema_faq": [ ... ]</text>
    <text x="24" y="205" fill="#F472B6" font-size="10" font-family="monospace">}</text>

    <rect x="16" y="225" width="228" height="34" rx="6" fill="#2E1065" stroke="#7C3AED" stroke-width="1"/>
    <text x="130" y="246" fill="#E9D5FF" font-size="10" font-weight="700" text-anchor="middle">Zero Hallucinations Guarantee</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(628, 270)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#818CF8" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="22,-4 30,0 22,4" fill="#818CF8"/>
  </g>

  <!-- Step 3: Human-in-the-loop CMS -->
  <g transform="translate(660, 150)" filter="url(#cardShadow)">
    <rect width="250" height="260" rx="12" fill="#151922" stroke="#10B981" stroke-width="1.5"/>
    <rect width="250" height="36" rx="12" fill="#064E3B"/>
    <path d="M0,24 L0,36 L250,36 L250,24 Z" fill="#064E3B"/>
    <text x="16" y="23" fill="#34D399" font-size="12" font-weight="700">3. HUMAN IN THE LOOP</text>

    <text x="16" y="65" fill="#E2E8F0" font-size="12" font-weight="700">Livewire 4 Modular Studio</text>
    <text x="16" y="85" fill="#94A3B8" font-size="11">Saved as 'Draft' for one-click edit:</text>

    <rect x="16" y="100" width="218" height="70" rx="6" fill="#0A1118" stroke="#1E3A34" stroke-width="1"/>
    <text x="24" y="120" fill="#A7F3D0" font-size="11">• Modular blocks (safe HTML)</text>
    <text x="24" y="138" fill="#A7F3D0" font-size="11">• Multi-tier image generation</text>
    <text x="24" y="156" fill="#A7F3D0" font-size="11">• One-Click instant publish</text>

    <rect x="16" y="185" width="218" height="42" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="125" y="210" fill="#D1FAE5" font-size="11" font-weight="700" text-anchor="middle">✓ Google Index 100% SEO</text>
  </g>

</svg>
