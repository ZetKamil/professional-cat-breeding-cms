<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0c0e14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" fill="url(#bgGlow)" rx="16"/>
  <rect width="958" height="478" x="1" y="1" fill="none" stroke="#232936" stroke-width="1.5" rx="15"/>

  <!-- Header Section -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
    <text x="65" y="17" fill="#E5C158" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">ARCHITECTURE PATTERN</text>
    
    <text x="0" y="58" fill="#FFFFFF" font-size="24" font-weight="700" letter-spacing="-0.5">Domain-Driven Action Pattern vs Fat Controllers</text>
    <text x="0" y="82" fill="#94A3B8" font-size="14">Strict separation of concerns: lightweight controllers (&lt;15 lines), isolated domain mutations, rich models.</text>
  </g>

  <!-- Flow Steps -->
  <!-- Step 1: HTTP & FormRequest -->
  <g transform="translate(48, 160)" filter="url(#cardShadow)">
    <rect width="190" height="240" rx="12" fill="#151922" stroke="#2D3748" stroke-width="1.5"/>
    <rect width="190" height="34" rx="12" fill="#1F2633"/>
    <path d="M0,22 L0,34 L190,34 L190,22 Z" fill="#1F2633"/>
    <text x="16" y="22" fill="#60A5FA" font-size="12" font-weight="700">1. HTTP INGRESS</text>
    
    <!-- Badges & Content -->
    <rect x="16" y="50" width="158" height="28" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
    <text x="26" y="68" fill="#93C5FD" font-size="12" font-weight="600">FormRequest</text>
    
    <text x="16" y="102" fill="#94A3B8" font-size="11" line-height="16">
      <tspan x="16" dy="0">• Strict RFC email validation</tspan>
      <tspan x="16" dy="20">• Rate limit throttle:5,1</tspan>
      <tspan x="16" dy="20">• Anti-bot honeypots</tspan>
      <tspan x="16" dy="20">• Auto-authorization policy</tspan>
    </text>

    <rect x="16" y="185" width="158" height="34" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="206" fill="#38BDF8" font-size="11" font-family="monospace">Controller &lt;15 lines</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(244, 270)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="26,-4 34,0 26,4" fill="#38BDF8"/>
  </g>

  <!-- Step 2: Domain Action (The Star) -->
  <g transform="translate(284, 150)" filter="url(#cardShadow)">
    <rect width="210" height="260" rx="14" fill="#161B26" stroke="#D4AF37" stroke-width="2"/>
    <rect width="210" height="38" rx="12" fill="url(#goldGrad)"/>
    <path d="M0,24 L0,38 L210,38 L210,24 Z" fill="#E5C158"/>
    <text x="16" y="24" fill="#111827" font-size="13" font-weight="800" letter-spacing="0.5">2. DOMAIN ACTION</text>
    
    <rect x="16" y="52" width="178" height="30" rx="6" fill="#202634" stroke="#D4AF37" stroke-width="1"/>
    <text x="26" y="72" fill="#FDE047" font-size="12" font-family="monospace" font-weight="700">app/Actions/Animals/...</text>
    
    <text x="16" y="110" fill="#E2E8F0" font-size="11">
      <tspan x="16" dy="0" font-weight="700" fill="#FBBF24">Single Responsibility</tspan>
      <tspan x="16" dy="20" fill="#94A3B8">• DB::transaction isolation</tspan>
      <tspan x="16" dy="18" fill="#94A3B8">• Atomic Cache::lock</tspan>
      <tspan x="16" dy="18" fill="#94A3B8">• Price &amp; sort order mutators</tspan>
      <tspan x="16" dy="18" fill="#94A3B8">• Media auto-attachment</tspan>
      <tspan x="16" dy="18" fill="#94A3B8">• Event dispatching</tspan>
    </text>

    <rect x="16" y="210" width="178" height="26" rx="6" fill="#2D2412" stroke="#D4AF37" stroke-width="1"/>
    <text x="105" y="227" fill="#FDE68A" font-size="11" font-weight="700" text-anchor="middle">Zero Business Logic in Views</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(500, 270)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#E5C158" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="26,-4 34,0 26,4" fill="#E5C158"/>
  </g>

  <!-- Step 3: Eloquent & Data Layer -->
  <g transform="translate(540, 160)" filter="url(#cardShadow)">
    <rect width="180" height="240" rx="12" fill="#151922" stroke="#2D3748" stroke-width="1.5"/>
    <rect width="180" height="34" rx="12" fill="#1F2633"/>
    <path d="M0,22 L0,34 L180,34 L180,22 Z" fill="#1F2633"/>
    <text x="16" y="22" fill="#34D399" font-size="12" font-weight="700">3. PERSISTENCE</text>
    
    <rect x="16" y="50" width="148" height="28" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
    <text x="24" y="68" fill="#A7F3D0" font-size="12" font-weight="600">Eloquent Models</text>
    
    <text x="16" y="102" fill="#94A3B8" font-size="11">
      <tspan x="16" dy="0">• Local query scopes</tspan>
      <tspan x="16" dy="18">  (scopeAvailable, published)</tspan>
      <tspan x="16" dy="20">• Backed Enums cast</tspan>
      <tspan x="16" dy="18">• Polymorphic relations</tspan>
      <tspan x="16" dy="20">• Insert-Only migrations</tspan>
    </text>

    <rect x="16" y="185" width="148" height="34" rx="6" fill="#0F172A" stroke="#10B981" stroke-width="1"/>
    <text x="24" y="206" fill="#10B981" font-size="11" font-weight="600">MySQL Ground Truth</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(726, 270)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#34D399" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="26,-4 34,0 26,4" fill="#34D399"/>
  </g>

  <!-- Step 4: Dispatched Events & UX -->
  <g transform="translate(766, 160)" filter="url(#cardShadow)">
    <rect width="146" height="240" rx="12" fill="#151922" stroke="#2D3748" stroke-width="1.5"/>
    <rect width="146" height="34" rx="12" fill="#1F2633"/>
    <path d="M0,22 L0,34 L146,34 L146,22 Z" fill="#1F2633"/>
    <text x="14" y="22" fill="#C084FC" font-size="12" font-weight="700">4. EVENTS &amp; UX</text>
    
    <rect x="14" y="50" width="118" height="28" rx="6" fill="#3B0764" stroke="#8B5CF6" stroke-width="1"/>
    <text x="22" y="68" fill="#E9D5FF" font-size="11" font-weight="600">Notifications</text>
    
    <text x="14" y="102" fill="#94A3B8" font-size="11">
      <tspan x="14" dy="0">• Queueable Mail</tspan>
      <tspan x="14" dy="20">• WhatsApp webhook</tspan>
      <tspan x="14" dy="20">• Facebook Pixel</tspan>
      <tspan x="14" dy="20">• GA4 conversion</tspan>
      <tspan x="14" dy="20">• Livewire refresh</tspan>
    </text>
    
    <circle cx="73" cy="202" r="16" fill="#8B5CF6" fill-opacity="0.2" stroke="#8B5CF6" stroke-width="1.5"/>
    <text x="73" y="206" fill="#C084FC" font-size="12" text-anchor="middle" font-weight="bold">✓</text>
  </g>

</svg>
