<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%" style="background:#0c0e14;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#151922"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#E5C158"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="960" height="480" fill="url(#bgGlow)" rx="16"/>
  <rect width="958" height="478" x="1" y="1" fill="none" stroke="#232936" stroke-width="1.5" rx="15"/>

  <!-- Header -->
  <g transform="translate(48, 44)">
    <rect x="0" y="0" width="190" height="26" rx="13" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-opacity="0.3" stroke-width="1"/>
    <text x="95" y="17" fill="#E5C158" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CRO &amp; PRODUCT DESIGN</text>
    
    <text x="0" y="58" fill="#FFFFFF" font-size="24" font-weight="700" letter-spacing="-0.5">Quiet Luxury Conversion Funnel &amp; UTM Engine</text>
    <text x="0" y="82" fill="#94A3B8" font-size="14">Frictionless lead capture designed for high-trust luxury buyers. Zero aggressive popups, 100% verbal agreement.</text>
  </g>

  <!-- Funnel Steps -->
  <!-- Box 1: Traffic & Dynamic UTM -->
  <g transform="translate(48, 150)" filter="url(#cardShadow)">
    <rect width="260" height="260" rx="12" fill="#151922" stroke="#2D3748" stroke-width="1.5"/>
    <rect width="260" height="36" rx="12" fill="#1F2633"/>
    <path d="M0,24 L0,36 L260,36 L260,24 Z" fill="#1F2633"/>
    <text x="16" y="23" fill="#60A5FA" font-size="12" font-weight="700">1. INGRESS &amp; ATTRIBUTION</text>

    <text x="16" y="65" fill="#E2E8F0" font-size="12" font-weight="700">Client Acquisition</text>
    <text x="16" y="85" fill="#94A3B8" font-size="11">Meta Ads / Organic Local SEO:</text>

    <rect x="16" y="98" width="228" height="52" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="24" y="118" fill="#38BDF8" font-size="10" font-family="monospace">?utm_source=fb_bengale</text>
    <text x="24" y="136" fill="#94A3B8" font-size="10" font-family="monospace">Stored in sessionStorage</text>

    <rect x="16" y="165" width="228" height="60" rx="6" fill="#1E293B"/>
    <text x="24" y="185" fill="#A7F3D0" font-size="11" font-weight="600">Dynamic WhatsApp Tagging</text>
    <text x="24" y="205" fill="#94A3B8" font-size="10">Appends [Kod: FB_bengale] into message</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(318, 270)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#E5C158" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="22,-4 30,0 22,4" fill="#E5C158"/>
  </g>

  <!-- Box 2: 1:1 Photography & Cropper -->
  <g transform="translate(358, 140)" filter="url(#cardShadow)">
    <rect width="260" height="280" rx="14" fill="#161B26" stroke="#D4AF37" stroke-width="2"/>
    <rect width="260" height="40" rx="12" fill="url(#goldGrad)"/>
    <path d="M0,26 L0,40 L260,40 L260,26 Z" fill="#E5C158"/>
    <text x="16" y="25" fill="#111827" font-size="13" font-weight="800">2. PHOTOGRAPHY FIRST</text>

    <text x="16" y="65" fill="#E2E8F0" font-size="12" font-weight="700">1:1 Aspect Ratio Cropper.js</text>
    <text x="16" y="85" fill="#94A3B8" font-size="11">Visual safe-zone guides prevent clipping:</text>

    <rect x="16" y="100" width="228" height="90" rx="8" fill="#11141C" stroke="#D4AF37" stroke-dasharray="3,3" stroke-width="1.5"/>
    <circle cx="130" cy="145" r="32" fill="#D4AF37" fill-opacity="0.1" stroke="#D4AF37" stroke-width="1"/>
    <text x="130" y="149" fill="#FDE047" font-size="10" font-weight="700" text-anchor="middle">SAFE ZONE</text>
    <text x="130" y="175" fill="#94A3B8" font-size="9" text-anchor="middle">Ears, Face &amp; Paws 100% visible</text>

    <rect x="16" y="205" width="228" height="42" rx="6" fill="#2D2412" stroke="#D4AF37" stroke-width="1"/>
    <text x="130" y="230" fill="#FDE68A" font-size="10" font-weight="700" text-anchor="middle">High-DPI WebP Generation (400/800/1200px)</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(628, 270)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#E5C158" stroke-width="2" stroke-dasharray="4,3"/>
    <polygon points="22,-4 30,0 22,4" fill="#E5C158"/>
  </g>

  <!-- Box 3: Conversions -->
  <g transform="translate(660, 150)" filter="url(#cardShadow)">
    <rect width="250" height="260" rx="12" fill="#151922" stroke="#10B981" stroke-width="1.5"/>
    <rect width="250" height="36" rx="12" fill="#064E3B"/>
    <path d="M0,24 L0,36 L250,36 L250,24 Z" fill="#064E3B"/>
    <text x="16" y="23" fill="#34D399" font-size="12" font-weight="700">3. HIGH CONVERSION</text>

    <text x="16" y="65" fill="#E2E8F0" font-size="12" font-weight="700">Pre-Qualified Leads</text>
    
    <g transform="translate(16, 80)">
      <rect x="0" y="0" width="218" height="32" rx="6" fill="#1C1917" stroke="#C5A059" stroke-width="1"/>
      <text x="10" y="20" fill="#E5C158" font-size="10" font-weight="700">💬 Messenger (Pre-filled chat)</text>

      <rect x="0" y="40" width="218" height="32" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
      <text x="10" y="60" fill="#A7F3D0" font-size="10" font-weight="700">📹 WhatsApp (Live Video-visit)</text>

      <rect x="0" y="80" width="218" height="32" rx="6" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
      <text x="10" y="100" fill="#93C5FD" font-size="10" font-weight="700">✨ 45s Behavioral Quiz</text>

      <rect x="0" y="120" width="218" height="32" rx="6" fill="#1E232F" stroke="#475569" stroke-width="1"/>
      <text x="10" y="140" fill="#E2E8F0" font-size="10" font-weight="700">📞 Quick 1-Field Callback</text>
    </g>

    <text x="125" y="246" fill="#34D399" font-size="11" font-weight="700" text-anchor="middle">✓ Highest Trust &amp; Conversion</text>
  </g>

</svg>
