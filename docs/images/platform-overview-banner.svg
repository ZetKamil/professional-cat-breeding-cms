      <text x="26" y="137" fill="#5EEAD4" font-size="9.5" font-family="monospace">utm_source=fb_ads_bengale</text>
      <text x="26" y="150" fill="#99F6E4" font-size="9.5" font-weight="600">&rarr; Injected as [Kod: FB_bengale] into WhatsApp</text>
