    <path d="M0,28 L0,48 L1200,48 L1200,28 Z" fill="#0C0E14"/>
    <line x1="0" y1="48" x2="1200" y2="48" stroke="#1E2432" stroke-width="1"/>

    <!-- Window Dots -->
    <circle cx="28" cy="24" r="6" fill="#FF5F56"/>
    <circle cx="48" cy="24" r="6" fill="#FFBD2E"/>
    <circle cx="68" cy="24" r="6" fill="#27C93F"/>

    <!-- Search/Address Bar -->
    <rect x="360" y="10" width="480" height="28" rx="7" fill="#151922" stroke="#262F40" stroke-width="1"/>
    <text x="600" y="28" fill="#94A3B8" font-size="12" font-family="monospace" text-anchor="middle">
      <tspan fill="#10B981">🔒 https://</tspan>kotyzmazowieckiejszwajcarii.pl <tspan fill="#64748B">[Production]</tspan>
    </text>
  </g>

  <!-- Title & Executive Eyebrow -->
