      <text x="24" y="108" fill="#F472B6" font-size="10" font-weight="600">Strict Schema Output (JSON):</text>
      <text x="24" y="122" fill="#FBCFE8" font-size="9.5" font-family="monospace">Zero Medical Hallucinations Guarantee</text>

      <rect x="16" y="138" width="276" height="24" rx="4" fill="#2E1065"/>
      <text x="154" y="154" fill="#E9D5FF" font-size="9.5" font-weight="700" text-anchor="middle">Production time: 4h &rarr; 3 minutes</text>
