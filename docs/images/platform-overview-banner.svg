    <text x="85" y="16" fill="#F3E5AB" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="1">ENTERPRISE B2C PLATFORM</text>

    <text x="0" y="52" fill="#FFFFFF" font-size="26" font-weight="800" letter-spacing="-0.5">Automated Sales, Attribution &amp; Operations Architecture</text>
    <text x="0" y="74" fill="#94A3B8" font-size="13.5">Full-Stack Laravel 12 + Livewire 4 platform powering high-ticket conversions and grounded AI content workflows.</text>
  </g>

