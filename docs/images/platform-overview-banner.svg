    <rect width="1104" height="38" rx="8" fill="#0C0F17" stroke="#1F2637" stroke-width="1"/>
    
    <text x="138" y="23" fill="#10B981" font-size="11.5" font-weight="700" text-anchor="middle">✓ 234 Automated Tests Passed (100%)</text>
    <line x1="276" y1="8" x2="276" y2="30" stroke="#222B3D" stroke-width="1"/>
    
    <text x="414" y="23" fill="#38BDF8" font-size="11.5" font-weight="700" text-anchor="middle">⚡ ~5s Fast Smoke Suite</text>
    <line x1="552" y1="8" x2="552" y2="30" stroke="#222B3D" stroke-width="1"/>
    
    <text x="690" y="23" fill="#E5C158" font-size="11.5" font-weight="700" text-anchor="middle">🔒 Atomic Concurrency Locks</text>
    <line x1="828" y1="8" x2="828" y2="30" stroke="#222B3D" stroke-width="1"/>
    
    <text x="966" y="23" fill="#C084FC" font-size="11.5" font-weight="700" text-anchor="middle">🛡️ Zero-Overwrite Production DB</text>
