    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Outer Canvas -->
  <rect width="1200" height="640" fill="url(#mainBg)" rx="18"/>
  <rect width="1198" height="638" x="1" y="1" fill="none" stroke="#222836" stroke-width="1.5" rx="17"/>

  <!-- Browser Window Chrome -->
  <g transform="translate(0, 0)">
